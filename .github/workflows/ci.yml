name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and metadata checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          find app mic dist script -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          bash -n dist/pkg/preinstall
          bash -n dist/pkg/postinstall
      - name: Validate property lists
        run: |
          plutil -lint app/Info.plist app/SiriRemote.entitlements
          plutil -lint app/Resources/en.lproj/InfoPlist.strings
          plutil -lint app/Resources/zh-Hans.lproj/InfoPlist.strings
          plutil -lint mic/driver/Info.plist mic/driver/CaptureTest-Info.plist
          plutil -lint mic/captured/com.deanxi.siriremote.capture.plist
      - name: Compile installer process verifier
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror \
            -mmacosx-version-min=13.0 dist/process_verifier.c \
            -o "$RUNNER_TEMP/SiriRemoteProcessVerifier"
      - name: Validate privileged rollback policy
        run: |
          ! grep -F '/private/var/tmp/com.deanxi.siriremote.install-backup' \
            dist/pkg/preinstall dist/pkg/postinstall
          grep -F 'mktemp -d "$INSTALL_STATE/backup.XXXXXX"' dist/pkg/preinstall
          grep -F 'load_backup_state' dist/pkg/postinstall
          grep -F 'validate_restored_components' dist/pkg/postinstall

  core:
    name: Core engine (SwiftPM tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build --package-path SiriRemoteCore
      - name: Test
        run: swift test --package-path SiriRemoteCore

  voice-decoder:
    name: Opus voice decoder
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned Opus and run decoder self-test
        working-directory: mic
        run: ./build-test.sh

  capture:
    name: Capture service
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run policy tests and compile unsigned CI binary
        working-directory: mic/captured
        run: SIRIREMOTE_COMPILE_ONLY=1 ./build.sh

  app:
    # Uses the same DoubaoVoiceSession implementation covered by the Core job.
    name: App (compiles and links)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app is compiled straight with swiftc (no Xcode project) and links the private
      # MultitouchSupport framework, which ships with macOS — so this only proves it builds.
      # It cannot RUN here: seizing the remote needs real hardware and Accessibility permission.
      - name: Build app
        working-directory: app
        run: ./build.sh
      - name: Verify embedded default configuration
        working-directory: app
        run: ./SiriRemote --verify-config

  hal:
    name: HAL contract, IO and sanitized lifecycle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build HAL and run isolated audio tests (no installation)
        working-directory: mic/driver
        run: SIRIREMOTE_COMPILE_ONLY=1 ./build.sh

  router:
    name: Voice router and PacketLogger parser
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build router and run parser regressions
        working-directory: mic/router
        run: SIRIREMOTE_COMPILE_ONLY=1 ./build.sh
